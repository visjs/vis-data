# Javascript Node CircleCI 2.1 configuration file
#
# Check https://circleci.com/docs/2.1/language-javascript/ for more details

version: 2.1

parameters:
  is-testing-interoperability:
    type: boolean
    default: true

executors:
  node:
    docker:
      - image: cimg/node:26.13.0-browsers@sha256:01b628bd45035abd1ae517587902db3a40553a458395b90f323867234a5f06b4
    resource_class: small
    working_directory: ~/repo
    environment:
      GIT_AUTHOR_EMAIL: visjsbot@gmail.com
      GIT_AUTHOR_NAME: vis-bot
      GIT_COMMITTER_EMAIL: visjsbot@gmail.com
      GIT_COMMITTER_NAME: vis-bot

  node-build:
    docker:
      - image: cimg/node:26.13.0-browsers@sha256:01b628bd45035abd1ae517587902db3a40553a458395b90f323867234a5f06b4
    resource_class: medium
    working_directory: ~/repo
    environment:
      GIT_AUTHOR_EMAIL: visjsbot@gmail.com
      GIT_AUTHOR_NAME: vis-bot
      GIT_COMMITTER_EMAIL: visjsbot@gmail.com
      GIT_COMMITTER_NAME: vis-bot

  node-interop:
    docker:
      - image: cimg/node:26.13.0-browsers@sha256:01b628bd45035abd1ae517587902db3a40553a458395b90f323867234a5f06b4
    resource_class: "medium+"
    working_directory: ~/repo
    environment:
      GIT_AUTHOR_EMAIL: visjsbot@gmail.com
      GIT_AUTHOR_NAME: vis-bot
      GIT_COMMITTER_EMAIL: visjsbot@gmail.com
      GIT_COMMITTER_NAME: vis-bot

jobs:
  prepare:
    executor: node

    steps:
      - checkout

      - run: npm ci

      - persist_to_workspace:
          root: ..
          paths:
            - ".cache"
            - "repo"

  build:
    executor: node-build

    steps:
      - attach_workspace:
          at: ..

      - run: npm run build

      - persist_to_workspace:
          root: ..
          paths:
            - "repo/declarations"
            - "repo/dist"
            - "repo/esnext"
            - "repo/peer"
            - "repo/standalone"

  lint:
    executor: node

    steps:
      - attach_workspace:
          at: ..

      - run: npm run style
      - run: npm run lint

  type_check:
    executor: node

    steps:
      - attach_workspace:
          at: ..

      - run: npm run type-check

  test_unit:
    executor: node

    steps:
      - attach_workspace:
          at: ..

      - run: npm run test:unit

  test_interop:
    executor: node-interop

    steps:
      - when:
          condition: << pipeline.parameters.is-testing-interoperability >>
          steps:
            - attach_workspace:
                at: ..

            - run: npm pack

            - run:
                command: npm run test:interop -- --tmp-dir ../interop
                # This runs multiple things in parallel and only reports start
                # and end of individual commands, the full logs are printed at
                # the end. Due to this it's quite likely to go a long time
                # without any output and still finish successfully.
                no_output_timeout: 60m

            - store_artifacts:
                path: ../interop/repos/logs
                destination: interop-logs

      - unless:
          condition: << pipeline.parameters.is-testing-interoperability >>
          steps:
            - run: printf -- '%s\n' 'The interop test was skipped as per params.'

  release:
    executor: node-build

    steps:
      - attach_workspace:
          at: ..

      - run:
          name: Release
          command: |
            git config --global http.https://github.com/.extraheader "Authorization: Basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" # Workaround for https://bugs.launchpad.net/ubuntu/+source/git/+bug/2171054
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            npx semantic-release

workflows:
  version: 2

  build:
    jobs:
      - prepare

      - build:
          requires:
            - prepare

      - lint:
          requires:
            - prepare

      - type_check:
          requires:
            - prepare

      - test_unit:
          requires:
            - prepare
            - build

      - test_interop:
          requires:
            - prepare
            - build

      - release:
          requires:
            - prepare
            - build
            - lint
            - type_check
            - test_unit
            - test_interop
          filters:
            branches:
              only:
                - master
